<rect x="65" y="280" width="380" height="130" fill="#c8dde8" stroke="#44647e" stroke-dasharray="7 5"/>
<text x="86" y="181" font-size="16">Nhà / mái che</text>
<text x="280" y="383" font-size="14">Vùng thu dưới mái</text>
<circle cx="120" cy="315" r="15" fill="#167ca6"/>
<text x="80" y="290" font-size="15">Servo + gá</text>
<path d="M120 315H385" stroke="#167ca6" stroke-width="8"/>
<path d="M120 315V560" stroke="#ce7b23" stroke-width="8"/>
<path d="M345 315A225 225 0 0 1 120 540" stroke="#167ca6" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="205" y="307" font-size="15">0°: yêu cầu thu</text>
<text x="142" y="555" font-size="15">90°: yêu cầu phơi</text>
<text x="244" y="476" font-size="14">Kiểm tra cả móc/vải</text><text x="244" y="496" font-size="14">trong toàn bộ cung quét</text>
<rect x="377" y="183" width="40" height="24" fill="#88b4cf" stroke="#44647e"/>
<text x="280" y="228" font-size="14">Quạt hướng vào đồ</text>
<text x="64" y="439" font-size="14">Mưa: ngoài mái, có độ nghiêng</text>
<text x="590" y="115" font-size="19" font-weight="bold">Mặt cắt: khoang và cảm biến</text>
<path d="M610 195H1000L1040 230H590Z" fill="#709bb8" stroke="#44647e" stroke-width="2"/>
