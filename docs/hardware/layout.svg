<text x="790" y="359" font-size="14">và gió thổi sát</text>
<text x="590" y="518" font-size="15">Chừa dây ngoài vùng xoay, tránh nơi đọng nước.</text>
<text x="590" y="544" font-size="15">Chọn SG90/MG90S sau khi thử tải demo.</text>
<text x="35" y="615" font-size="15" font-weight="bold">Trạng thái 0°/90° là yêu cầu điều khiển; servo hiện không có phản hồi vị trí.</text>
