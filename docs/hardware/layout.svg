<text x="627" y="460" font-size="15">Nguồn / phân phối tải / chung GND</text>
<rect x="637" y="278" width="108" height="40" fill="#cae8ce" stroke="#44647e"/>
<text x="650" y="304" font-size="15">LCD1602</text>
<circle cx="658" cy="346" r="9" fill="#167ca6"/><circle cx="690" cy="346" r="9" fill="#167ca6"/><circle cx="722" cy="346" r="9" fill="#167ca6"/>
