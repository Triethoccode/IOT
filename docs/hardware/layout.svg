<rect width="1100" height="650" fill="#f6f8fb"/>
<g font-family="Arial,sans-serif" fill="#172b41">
<text x="35" y="42" font-size="25" font-weight="bold">AeroDry G21 — bố trí danh định W08</text>
<text x="35" y="70" font-size="15">350 × 250 × 300 mm · Formex 5 mm · sơ đồ nguyên lý, không phải bản gia công theo tỉ lệ</text>
<text x="45" y="115" font-size="19" font-weight="bold">Mặt bằng: sào xoay ngang</text>
